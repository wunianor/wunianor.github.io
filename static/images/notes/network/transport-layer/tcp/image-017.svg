<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="tcp-header-title tcp-header-desc">
  <title id="tcp-header-title">TCP 报文段格式</title>
  <desc id="tcp-header-desc">TCP 报文段由标准报头、选项和有效载荷组成：标准报头固定 20 字节，含源端口号、目的端口号、序号、确认序号、首部长度、保留位、六个标志位、窗口大小、检验和与紧急指针；选项最长 40 字节，其后是数据。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.25; }
      .grid-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.25; }
      .grid-dash { fill: #f8fafc; stroke: #93c5fd; stroke-width: 1.25; stroke-dasharray: 6 4; }
      .grid-amber { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.25; }
      .divider { stroke: #93c5fd; stroke-width: 1.25; }
      .brace { stroke: #64748b; stroke-width: 1.25; fill: none; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; }
      .title { fill: #0f172a; font-size: 22px; font-weight: 600; }
      .muted { fill: #64748b; font-size: 13.5px; }
      .ruler { fill: #475569; font-size: 13.5px; font-weight: 600; }
      .cell { fill: #0f172a; font-size: 13.5px; font-weight: 600; }
      .flag { fill: #0f172a; font-size: 10.5px; font-weight: 600; font-family: Consolas, "Cascadia Code", ui-monospace, monospace; }
      .group { fill: #475569; font-size: 13px; font-weight: 600; }
      .group-sm { fill: #64748b; font-size: 12px; }
      .note { fill: #334155; font-size: 13.5px; }
      .badge { fill: #1d4ed8; }
      .badge-t { fill: #ffffff; font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" width="900" height="640"/>
  <text class="title" x="48" y="52">TCP 报文段格式</text>
  <text class="muted" x="48" y="78">标准报头固定 20 字节 ＋ 选项（最长 40 字节）＋ 数据</text>

  <!-- 位标尺 -->
  <text class="ruler" x="130" y="116">0</text>
  <text class="ruler" x="490" y="116" text-anchor="middle">15 16</text>
  <text class="ruler" x="850" y="116" text-anchor="end">31</text>
  <path d="M 130 124 L 850 124" stroke="#94a3b8" stroke-width="1"/>

  <!-- 第 1 行 -->
  <rect class="grid-blue" x="130" y="132" width="720" height="52"/>
  <text class="cell" x="310" y="165" text-anchor="middle">16位源端口号</text>
  <text class="cell" x="670" y="165" text-anchor="middle">16位目的端口号</text>
  <line class="divider" x1="490" y1="132" x2="490" y2="184"/>
  <!-- 第 2 行 -->
  <rect class="grid-blue" x="130" y="184" width="720" height="52"/>
  <text class="cell" x="490" y="217" text-anchor="middle">32位序号</text>
  <!-- 第 3 行 -->
  <rect class="grid-blue" x="130" y="236" width="720" height="52"/>
  <text class="cell" x="490" y="269" text-anchor="middle">32位确认序号</text>
  <!-- 第 4 行 -->
  <rect class="grid-blue" x="130" y="288" width="720" height="52"/>
  <text class="cell" x="190" y="321" text-anchor="middle">4位首部长度</text>
  <text class="cell" x="290" y="321" text-anchor="middle">保留6位</text>
  <rect class="grid-blue" x="330" y="288" width="26.67" height="52"/>
  <rect class="grid-blue" x="356.67" y="288" width="26.67" height="52"/>
  <rect class="grid-blue" x="383.33" y="288" width="26.67" height="52"/>
  <rect class="grid-blue" x="410" y="288" width="26.67" height="52"/>
  <rect class="grid-blue" x="436.67" y="288" width="26.67" height="52"/>
  <rect class="grid-blue" x="463.33" y="288" width="26.67" height="52"/>
  <text class="flag" x="343.33" y="319" text-anchor="middle">URG</text>
  <text class="flag" x="370" y="319" text-anchor="middle">ACK</text>
  <text class="flag" x="396.67" y="319" text-anchor="middle">PSH</text>
  <text class="flag" x="423.33" y="319" text-anchor="middle">RST</text>
  <text class="flag" x="450" y="319" text-anchor="middle">SYN</text>
  <text class="flag" x="476.67" y="319" text-anchor="middle">FIN</text>
  <text class="cell" x="670" y="321" text-anchor="middle">16位窗口大小</text>
  <line class="divider" x1="250" y1="288" x2="250" y2="340"/>
  <line class="divider" x1="330" y1="288" x2="330" y2="340"/>
  <line class="divider" x1="490" y1="288" x2="490" y2="340"/>
  <!-- 第 5 行 -->
  <rect class="grid-blue" x="130" y="340" width="720" height="52"/>
  <text class="cell" x="310" y="373" text-anchor="middle">16位检验和</text>
  <text class="cell" x="670" y="373" text-anchor="middle">16位紧急指针</text>
  <line class="divider" x1="490" y1="340" x2="490" y2="392"/>
  <!-- 第 6 行：选项 -->
  <rect class="grid-dash" x="130" y="392" width="720" height="52"/>
  <text class="cell" x="490" y="425" text-anchor="middle">选项</text>
  <!-- 第 7 行：数据 -->
  <rect class="grid-amber" x="130" y="444" width="720" height="52"/>
  <text class="cell" x="490" y="477" text-anchor="middle">数据</text>

  <!-- 序号标记 -->
  <circle class="badge" cx="146" cy="300" r="7.5"/>
  <text class="badge-t" x="146" y="304" text-anchor="middle">1</text>
  <circle class="badge" cx="506" cy="300" r="7.5"/>
  <text class="badge-t" x="506" y="304" text-anchor="middle">2</text>

  <!-- 左侧分组 -->
  <path class="brace" d="M 118 132 L 104 132 L 104 392 L 118 392"/>
  <path class="brace" d="M 118 392 L 104 392 L 104 444 L 118 444"/>
  <path class="brace" d="M 118 444 L 104 444 L 104 496 L 118 496"/>
  <text class="group" x="98" y="256" text-anchor="end">标准报头</text>
  <text class="group-sm" x="98" y="276" text-anchor="end">（20 字节）</text>
  <text class="group" x="98" y="414" text-anchor="end">选项</text>
  <text class="group-sm" x="98" y="434" text-anchor="end">（最大 40B）</text>
  <text class="group" x="98" y="474" text-anchor="end">有效载荷</text>

  <!-- 说明 -->
  <rect class="card" x="48" y="530" width="804" height="86" rx="12"/>
  <circle class="badge" cx="76" cy="562" r="8"/>
  <text class="badge-t" x="76" y="566" text-anchor="middle">1</text>
  <text class="note" x="94" y="567">首部长度以 4 字节为单位，数值 × 4B ＝ 标准报头加选项的大小（首部最大 60B）。</text>
  <circle class="badge" cx="76" cy="594" r="8"/>
  <text class="badge-t" x="76" y="598" text-anchor="middle">2</text>
  <text class="note" x="94" y="599">16位窗口大小 ＝ 本机接收缓冲区剩余空间右移 M 位（M 为首部选项中的窗口扩大因子）；单位字节，用于流量控制。</text>
</svg>
