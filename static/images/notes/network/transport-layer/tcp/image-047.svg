<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" width="1120" height="650" role="img" aria-labelledby="tcp-cwnd-title tcp-cwnd-desc">
  <title id="tcp-cwnd-title">拥塞窗口 cwnd 的变化曲线</title>
  <desc id="tcp-cwnd-desc">拥塞窗口随传输轮次变化：慢开始按指数规律增长，到达 ssthresh 后转为拥塞避免的加法增大；遇到网络拥塞时乘法减小，ssthresh 减半、cwnd 回落到 1，再重新慢开始。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .axis { stroke: #475569; stroke-width: 1.6; }
      .tick { stroke: #94a3b8; stroke-width: 1.2; }
      .ticklabel { fill: #475569; font-size: 13.5px; font-weight: 600; }
      .curve { fill: none; stroke: #1e293b; stroke-width: 2; }
      .pt { fill: #1e293b; }
      .dash { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .dim-arrow { stroke: #1d4ed8; stroke-width: 1.6; fill: none; }
      .leader { stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; }
      .title { fill: #0f172a; font-size: 22px; font-weight: 600; }
      .muted { fill: #64748b; font-size: 13.5px; }
      .axisname { fill: #0f172a; font-size: 15px; font-weight: 600; }
      .tag { fill: #1d4ed8; font-size: 13.5px; font-weight: 600; }
      .tag-dark { fill: #0f172a; font-size: 13.5px; font-weight: 600; }
      .tag-red { fill: #b91c1c; font-size: 13.5px; font-weight: 600; }
    </style>
    <marker id="arw-axis" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#475569" stroke="none"/>
    </marker>
    <marker id="arw-dim" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#1d4ed8" stroke="none"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="650"/>
  <text class="title" x="44" y="52">拥塞窗口 cwnd 的变化曲线</text>
  <text class="muted" x="44" y="76">慢开始 → 网络拥塞 → 乘法减小 → 慢开始 → 拥塞避免</text>

  <!-- 坐标轴 -->
  <line class="axis" x1="250" y1="545" x2="250" y2="136" marker-end="url(#arw-axis)"/>
  <line class="axis" x1="250" y1="540" x2="1066" y2="540" marker-end="url(#arw-axis)"/>
  <text class="axisname" x="200" y="124" text-anchor="middle">拥塞窗口 cwnd</text>
  <text class="axisname" x="1060" y="524" text-anchor="end">传输轮次</text>

  <!-- x 轴刻度 -->
  <g class="tick">
    <line x1="250" y1="540" x2="250" y2="546"/><line x1="322" y1="540" x2="322" y2="546"/>
    <line x1="394" y1="540" x2="394" y2="546"/><line x1="466" y1="540" x2="466" y2="546"/>
    <line x1="538" y1="540" x2="538" y2="546"/><line x1="610" y1="540" x2="610" y2="546"/>
    <line x1="682" y1="540" x2="682" y2="546"/><line x1="754" y1="540" x2="754" y2="546"/>
    <line x1="826" y1="540" x2="826" y2="546"/><line x1="898" y1="540" x2="898" y2="546"/>
    <line x1="970" y1="540" x2="970" y2="546"/><line x1="1042" y1="540" x2="1042" y2="546"/>
  </g>
  <g class="ticklabel" text-anchor="middle">
    <text x="250" y="566">0</text><text x="322" y="566">2</text><text x="394" y="566">4</text>
    <text x="466" y="566">6</text><text x="538" y="566">8</text><text x="610" y="566">10</text>
    <text x="682" y="566">12</text><text x="754" y="566">14</text><text x="826" y="566">16</text>
    <text x="898" y="566">18</text><text x="970" y="566">20</text><text x="1042" y="566">22</text>
  </g>

  <!-- y 轴刻度 -->
  <g class="tick">
    <line x1="250" y1="540" x2="244" y2="540"/><line x1="250" y1="476" x2="244" y2="476"/>
    <line x1="250" y1="412" x2="244" y2="412"/><line x1="250" y1="348" x2="244" y2="348"/>
    <line x1="250" y1="284" x2="244" y2="284"/><line x1="250" y1="220" x2="244" y2="220"/>
    <line x1="250" y1="156" x2="244" y2="156"/>
  </g>
  <g class="ticklabel" text-anchor="end">
    <text x="240" y="545">0</text><text x="240" y="481">4</text><text x="240" y="417">8</text>
    <text x="240" y="353">12</text><text x="240" y="289">16</text><text x="240" y="225">20</text>
    <text x="240" y="161">24</text>
  </g>

  <!-- ssthresh 虚线 -->
  <line class="dash" x1="250" y1="284" x2="700" y2="284"/>
  <line class="dash" x1="250" y1="348" x2="880" y2="348"/>
  <text class="tag" x="205" y="289" text-anchor="end">ssthresh 的初始值</text>
  <text class="tag" x="205" y="353" text-anchor="end">新的 ssthresh 值</text>

  <!-- cwnd 曲线 -->
  <path class="curve" d="M 250 524 L 286 508 L 322 476 L 358 412 L 394 284 L 430 268 L 466 252 L 502 236 L 538 220 L 574 204 L 610 188 L 646 172 L 682 156 L 718 524 L 754 508 L 790 476 L 826 412 L 862 348 L 898 332 L 934 316 L 970 300 L 1006 284 L 1042 268"/>

  <!-- 数据点 -->
  <g class="pt">
    <circle cx="250" cy="524" r="3.6"/><circle cx="286" cy="508" r="3.6"/>
    <circle cx="322" cy="476" r="3.6"/><circle cx="358" cy="412" r="3.6"/>
    <circle cx="394" cy="284" r="3.6"/><circle cx="430" cy="268" r="3.6"/>
    <circle cx="466" cy="252" r="3.6"/><circle cx="502" cy="236" r="3.6"/>
    <circle cx="538" cy="220" r="3.6"/><circle cx="574" cy="204" r="3.6"/>
    <circle cx="610" cy="188" r="3.6"/><circle cx="646" cy="172" r="3.6"/>
    <circle cx="682" cy="156" r="3.6"/><circle cx="718" cy="524" r="3.6"/>
    <circle cx="754" cy="508" r="3.6"/><circle cx="790" cy="476" r="3.6"/>
    <circle cx="826" cy="412" r="3.6"/><circle cx="862" cy="348" r="3.6"/>
    <circle cx="898" cy="332" r="3.6"/><circle cx="934" cy="316" r="3.6"/>
    <circle cx="970" cy="300" r="3.6"/><circle cx="1006" cy="284" r="3.6"/>
    <circle cx="1042" cy="268" r="3.6"/>
  </g>

  <!-- 网络拥塞 -->
  <text class="tag-red" x="762" y="118">网络拥塞</text>
  <path class="leader" d="M 758 124 L 692 150"/>

  <!-- 乘法减小 -->
  <path class="dim-arrow" d="M 712 250 L 712 160" marker-end="url(#arw-dim)"/>
  <path class="dim-arrow" d="M 712 250 L 712 344" marker-end="url(#arw-dim)"/>
  <text class="tag" x="724" y="258">乘法减小</text>

  <!-- 慢开始 / 指数规律增长（第一段） -->
  <text class="tag-dark" x="180" y="502" text-anchor="middle">慢开始</text>
  <path class="leader" d="M 216 500 L 246 532"/>
  <text class="tag-dark" x="470" y="492" text-anchor="middle">指数规律增长</text>
  <path class="leader" d="M 432 486 L 396 424"/>

  <!-- 拥塞避免「加法增大」（第一段） -->
  <text class="tag-dark" x="470" y="150" text-anchor="middle">拥塞避免</text>
  <text class="tag-dark" x="470" y="172" text-anchor="middle">「加法增大」</text>
  <path class="leader" d="M 480 182 L 500 244"/>

  <!-- 慢开始（第二段） -->
  <text class="tag-dark" x="820" y="596" text-anchor="middle">慢开始</text>

  <!-- 拥塞避免「加法增大」（第二段） -->
  <text class="tag-dark" x="980" y="228" text-anchor="start">拥塞避免</text>
  <text class="tag-dark" x="980" y="250" text-anchor="start">「加法增大」</text>
  <path class="leader" d="M 978 256 L 958 300"/>
</svg>
