<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" width="1080" height="660" role="img" aria-labelledby="tcp-wave-title tcp-wave-desc">
  <title id="tcp-wave-title">四次挥手时序</title>
  <desc id="tcp-wave-desc">主动方与被动方四次挥手的时序图：主动方先发 FIN 进入 FIN_WAIT_1，被动方回 ACK 后进入 CLOSE_WAIT，被动方再发 FIN 进入 LAST_ACK，主动方回 ACK 后进入 TIME_WAIT，经过 2MSL 才回到 CLOSED；四条报文线自上而下带一点下斜，表示报文在时间上的先后。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.25; }
      .chip { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.25; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; }
      .title { fill: #0f172a; font-size: 22px; font-weight: 600; }
      .muted { fill: #64748b; font-size: 13.5px; }
      .label { fill: #0f172a; font-size: 15px; font-weight: 600; }
      .msg { fill: #1e293b; font-size: 14px; font-weight: 600; font-family: Consolas, "Cascadia Code", ui-monospace, monospace; }
      .state { fill: #1e293b; font-size: 13px; font-weight: 600; font-family: Consolas, "Cascadia Code", ui-monospace, monospace; }
      .mono { fill: #1e293b; font-size: 13.5px; font-family: Consolas, "Cascadia Code", ui-monospace, monospace; }
      .note { fill: #475569; font-size: 13.5px; }
      .dot { fill: #94a3b8; }
      .lifeline { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; }
      .tick { stroke: #cbd5e1; stroke-width: 1.25; }
      .msg-line { stroke: #334155; stroke-width: 1.6; fill: none; }
      .leader { stroke: #94a3b8; stroke-width: 1.25; stroke-dasharray: 4 3; fill: none; }
    </style>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#334155" stroke="none"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#94a3b8" stroke="none"/>
    </marker>
  </defs>

  <rect class="bg" width="1080" height="660"/>
  <text class="title" x="48" y="52">四次挥手时序</text>
  <text class="muted" x="48" y="78">主动方先关闭自己的发送方向，被动方随后关闭，一次断开需要两组报文</text>

  <path class="lifeline" d="M 380 150 L 380 580"/>
  <path class="lifeline" d="M 660 150 L 660 580"/>
  <rect class="card" x="320" y="110" width="120" height="38" rx="8"/>
  <text class="label" x="380" y="135" text-anchor="middle">主动方 A</text>
  <rect class="card" x="600" y="110" width="120" height="38" rx="8"/>
  <text class="label" x="660" y="135" text-anchor="middle">被动方 B</text>

  <path class="msg-line" d="M 380 214 L 656 242" marker-end="url(#ah)"/>
  <text class="msg" x="520" y="211" text-anchor="middle">FIN</text>
  <path class="msg-line" d="M 660 294 L 384 322" marker-end="url(#ah)"/>
  <text class="msg" x="520" y="291" text-anchor="middle">ACK</text>
  <path class="msg-line" d="M 660 374 L 384 402" marker-end="url(#ah)"/>
  <text class="msg" x="520" y="371" text-anchor="middle">FIN</text>
  <path class="msg-line" d="M 380 454 L 656 482" marker-end="url(#ah)"/>
  <text class="msg" x="520" y="451" text-anchor="middle">ACK</text>

  <rect class="chip" x="256" y="202" width="104" height="24" rx="6"/>
  <text class="state" x="308" y="219" text-anchor="middle">FIN_WAIT_1</text>
  <path class="tick" d="M 360 214 L 380 214"/>
  <rect class="chip" x="256" y="310" width="104" height="24" rx="6"/>
  <text class="state" x="308" y="327" text-anchor="middle">FIN_WAIT_2</text>
  <path class="tick" d="M 360 322 L 380 322"/>
  <rect class="chip" x="268" y="442" width="92" height="24" rx="6"/>
  <text class="state" x="314" y="459" text-anchor="middle">TIME_WAIT</text>
  <path class="tick" d="M 360 454 L 380 454"/>
  <rect class="chip" x="290" y="538" width="70" height="24" rx="6"/>
  <text class="state" x="325" y="555" text-anchor="middle">CLOSED</text>
  <path class="tick" d="M 360 550 L 380 550"/>

  <rect class="chip" x="680" y="282" width="96" height="24" rx="6"/>
  <text class="state" x="728" y="299" text-anchor="middle">CLOSE_WAIT</text>
  <path class="tick" d="M 660 294 L 680 294"/>
  <rect class="chip" x="680" y="362" width="88" height="24" rx="6"/>
  <text class="state" x="724" y="379" text-anchor="middle">LAST_ACK</text>
  <path class="tick" d="M 660 374 L 680 374"/>
  <rect class="chip" x="680" y="470" width="70" height="24" rx="6"/>
  <text class="state" x="715" y="487" text-anchor="middle">CLOSED</text>
  <path class="tick" d="M 660 482 L 680 482"/>

  <rect class="card" x="48" y="150" width="176" height="84" rx="10"/>
  <text class="mono" x="70" y="186">close(fd)</text>
  <text class="note" x="70" y="212">关闭连接</text>
  <path class="leader" d="M 230 192 L 372 192" marker-end="url(#ah-gray)"/>

  <rect class="card" x="830" y="240" width="200" height="150" rx="10"/>
  <text class="mono" x="852" y="276">read(connfd)</text>
  <text class="note" x="852" y="300">阻塞等待客户端数据请求</text>
  <text class="mono" x="852" y="326">read返回0</text>
  <text class="mono" x="852" y="352">close(connfd)</text>
  <path class="leader" d="M 826 350 L 674 350" marker-end="url(#ah-gray)"/>

  <text class="muted" x="48" y="504">TIME_WAIT 持续 2MSL</text>
  <text class="muted" x="48" y="526">（60~120 秒）后进入 CLOSED</text>

  <circle class="dot" cx="60" cy="620" r="3.5"/>
  <text class="note" x="76" y="625">断开连接的本质是没有应用层的数据再要向对方发送了；发送是双向的，因此需要断开 2 次。</text>
</svg>
