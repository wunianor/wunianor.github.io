<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img" aria-labelledby="tcp-seq-title tcp-seq-desc">
  <title id="tcp-seq-title">TCP 的序号与确认序号</title>
  <desc id="tcp-seq-desc">TCP 面向字节流，每个字节都被连续编号，序列号就是本段第一个字节的编号；确认序号填的是收到报文的序号加一，表示该序号之前的数据已经全部收到。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.25; }
      .strip { fill: #dbeafe; }
      .strip-line { stroke: #60a5fa; stroke-width: 1; }
      .strip-border { stroke: #60a5fa; stroke-width: 1.4; fill: none; }
      .brace { stroke: #1d4ed8; stroke-width: 1.5; fill: none; }
      .tick { stroke: #1d4ed8; stroke-width: 1.5; }
      .sep { stroke: #e2e8f0; stroke-width: 1.25; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; }
      .title { fill: #0f172a; font-size: 22px; font-weight: 600; }
      .muted { fill: #64748b; font-size: 13.5px; }
      .cell-t { fill: #334155; font-size: 11.5px; }
      .dots { fill: #94a3b8; font-size: 15px; font-weight: 600; }
      .seq { fill: #1d4ed8; font-size: 14px; font-weight: 600; }
      .note { fill: #334155; font-size: 14px; }
      .note-sm { fill: #475569; font-size: 13px; }
      .card-title { fill: #0f172a; font-size: 15px; font-weight: 600; }
      .mono { fill: #1e293b; font-size: 13.5px; font-family: Consolas, "Cascadia Code", ui-monospace, monospace; }
      .hl { fill: #b45309; font-weight: 600; }
    </style>
    <pattern id="cells" width="26" height="44" patternUnits="userSpaceOnUse">
      <rect width="26" height="44" fill="#dbeafe"/>
      <line x1="0" y1="0" x2="0" y2="44" stroke="#60a5fa" stroke-width="1"/>
    </pattern>
  </defs>

  <rect class="bg" width="1180" height="640"/>
  <text class="title" x="48" y="52">序号与确认序号</text>
  <text class="muted" x="48" y="78">TCP 面向字节流，每一个字节都被连续地编号</text>

  <!-- 大括号标注 -->
  <text class="seq" x="260" y="124" text-anchor="middle">序列号 1-1000</text>
  <text class="seq" x="520" y="124" text-anchor="middle">序列号 1001-2000</text>
  <text class="seq" x="780" y="124" text-anchor="middle">序列号 2001-3000</text>
  <path class="brace" d="M 130 150 L 130 140 L 390 140 L 390 150"/>
  <path class="brace" d="M 390 150 L 390 140 L 650 140 L 650 150"/>
  <path class="brace" d="M 650 150 L 650 140 L 910 140 L 910 150"/>
  <line class="tick" x1="260" y1="140" x2="260" y2="130"/>
  <line class="tick" x1="520" y1="140" x2="520" y2="130"/>
  <line class="tick" x1="780" y1="140" x2="780" y2="130"/>

  <!-- 字节流 -->
  <rect class="strip" x="130" y="158" width="780" height="44"/>
  <rect x="130" y="158" width="780" height="44" fill="url(#cells)"/>
  <rect class="strip-border" x="130" y="158" width="780" height="44"/>
  <line class="strip-line" x1="390" y1="158" x2="390" y2="202"/>
  <line class="strip-line" x1="650" y1="158" x2="650" y2="202"/>
  <text class="dots" x="286" y="187" text-anchor="middle">⋯</text>
  <text class="dots" x="533" y="187" text-anchor="middle">⋯</text>
  <text class="dots" x="806" y="187" text-anchor="middle">⋯</text>

  <!-- 字节编号 -->
  <text class="cell-t" x="143" y="210" text-anchor="end" transform="rotate(-90 143 210)">第1字节</text>
  <text class="cell-t" x="169" y="210" text-anchor="end" transform="rotate(-90 169 210)">第2字节</text>
  <text class="cell-t" x="195" y="210" text-anchor="end" transform="rotate(-90 195 210)">第3字节</text>
  <text class="cell-t" x="377" y="210" text-anchor="end" transform="rotate(-90 377 210)">第1000字节</text>
  <text class="cell-t" x="403" y="210" text-anchor="end" transform="rotate(-90 403 210)">第1001字节</text>
  <text class="cell-t" x="429" y="210" text-anchor="end" transform="rotate(-90 429 210)">第1002字节</text>
  <text class="cell-t" x="637" y="210" text-anchor="end" transform="rotate(-90 637 210)">第2000字节</text>
  <text class="cell-t" x="663" y="210" text-anchor="end" transform="rotate(-90 663 210)">第2001字节</text>
  <text class="cell-t" x="689" y="210" text-anchor="end" transform="rotate(-90 689 210)">第2002字节</text>

  <text class="note" x="48" y="308">序列号 ＝ 本段第一个字节的编号</text>

  <!-- 三张说明卡 -->
  <rect class="card" x="48" y="352" width="345" height="220" rx="12"/>
  <text class="card-title" x="72" y="388">序号</text>
  <line class="sep" x1="72" y1="400" x2="369" y2="400"/>
  <text class="note" x="72" y="430">TCP 把每个字节的数据都进行了</text>
  <text class="note" x="72" y="452">编号，即为序列号。</text>
  <text class="note-sm" x="72" y="490">每段数据的序列号，就是该段</text>
  <text class="note-sm" x="72" y="512">第一个字节的编号。</text>

  <rect class="card" x="419" y="352" width="345" height="220" rx="12"/>
  <text class="card-title" x="443" y="388">发送缓冲区</text>
  <line class="sep" x1="443" y1="400" x2="740" y2="400"/>
  <text class="mono" x="443" y="434">char outbuffer[N]</text>
  <text class="note" x="443" y="470">数组下标即字节编号，所以每个</text>
  <text class="note" x="443" y="492">字节天然就有自己的编号。</text>

  <rect class="card" x="790" y="352" width="345" height="220" rx="12"/>
  <text class="card-title" x="814" y="388">确认序号</text>
  <line class="sep" x1="814" y1="400" x2="1111" y2="400"/>
  <text class="note" x="814" y="430">填充的是收到报文的序号 <tspan class="hl">＋1</tspan>。</text>
  <text class="note" x="814" y="458">表示「确认序号之前的数据我</text>
  <text class="note" x="814" y="480">已经全部收到了」，下一次发送</text>
  <text class="note" x="814" y="502">请从确认序号指定的数字开始。</text>
</svg>
