<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1060" width="1180" height="1060" role="img" aria-labelledby="tcp-window-title tcp-window-desc">
  <title id="tcp-window-title">窗口探测与窗口更新</title>
  <desc id="tcp-window-desc">发送方按接收方通告的窗口大小发送数据，窗口从 3000 降到 0 后发送端阻塞；过了重发超时时间仍未收到窗口更新通知，就发送一个窗口探测包，接收方窗口有空间后再发窗口更新通知，通信恢复。一旦窗口更新通知在传送途中丢失，就靠发送端时不时发窗口探测包来兜底。报文线自上而下带一点下斜，表示报文在时间上的先后。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.25; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; }
      .title { fill: #0f172a; font-size: 22px; font-weight: 600; }
      .muted { fill: #64748b; font-size: 13.5px; }
      .label { fill: #0f172a; font-size: 15px; font-weight: 600; }
      .col { fill: #94a3b8; font-size: 13px; font-weight: 600; }
      .data { fill: #1e293b; font-size: 13.5px; font-weight: 600; }
      .ack { fill: #1e293b; font-size: 13.5px; }
      .win { fill: #1d4ed8; font-size: 13.5px; font-weight: 600; font-family: Consolas, "Cascadia Code", ui-monospace, monospace; }
      .tag { fill: #1d4ed8; font-size: 14px; font-weight: 600; }
      .note { fill: #475569; font-size: 13.5px; }
      .axis { fill: #94a3b8; font-size: 13px; }
      .axis-v { fill: #b45309; font-size: 13.5px; font-weight: 600; }
      .badge { fill: #1d4ed8; }
      .badge-t { fill: #ffffff; font-size: 10px; font-weight: 600; }
      .lifeline { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; }
      .msg-line { stroke: #334155; stroke-width: 1.6; fill: none; }
      .probe-line { stroke: #1d4ed8; stroke-width: 1.8; fill: none; }
      .upd-line { stroke: #b45309; stroke-width: 1.8; fill: none; }
      .gauge { stroke: #b45309; stroke-width: 1.5; fill: none; }
      .interval { stroke: #1d4ed8; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
      .span { stroke: #b45309; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    </style>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#334155" stroke="none"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#1d4ed8" stroke="none"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#b45309" stroke="none"/>
    </marker>
  </defs>

  <rect class="bg" width="1180" height="1060"/>
  <text class="title" x="48" y="52">窗口探测与窗口更新</text>
  <text class="muted" x="48" y="78">发送方按接收方通告的窗口大小发送数据，窗口降为 0 后靠窗口探测与窗口更新通知恢复通信</text>

  <path class="lifeline" d="M 330 150 L 330 980"/>
  <path class="lifeline" d="M 850 150 L 850 980"/>
  <rect class="card" x="270" y="108" width="120" height="38" rx="8"/>
  <text class="label" x="330" y="133" text-anchor="middle">发送方 A</text>
  <rect class="card" x="790" y="108" width="120" height="38" rx="8"/>
  <text class="label" x="850" y="133" text-anchor="middle">接收方 B</text>

  <text class="col" x="310" y="162" text-anchor="end">数据</text>
  <text class="col" x="870" y="162">确认应答</text>
  <text class="col" x="980" y="162">窗口</text>

  <path class="msg-line" d="M 330 176 L 846 208" marker-end="url(#ah)"/>
  <text class="data" x="310" y="181" text-anchor="end">数据 1~1000</text>
  <path class="msg-line" d="M 850 232 L 334 264" marker-end="url(#ah)"/>
  <text class="ack" x="870" y="237">下一个是1001</text>
  <text class="win" x="980" y="237">窗口3000</text>

  <path class="msg-line" d="M 330 288 L 846 320" marker-end="url(#ah)"/>
  <text class="data" x="310" y="293" text-anchor="end">数据 1001~2000</text>
  <path class="msg-line" d="M 850 344 L 334 376" marker-end="url(#ah)"/>
  <text class="ack" x="870" y="349">下一个是2001</text>
  <text class="win" x="980" y="349">窗口2000</text>

  <path class="msg-line" d="M 330 400 L 846 432" marker-end="url(#ah)"/>
  <text class="data" x="310" y="405" text-anchor="end">数据 2001~3000</text>
  <path class="msg-line" d="M 850 456 L 334 488" marker-end="url(#ah)"/>
  <text class="ack" x="870" y="461">下一个是3001</text>
  <text class="win" x="980" y="461">窗口1000</text>

  <path class="msg-line" d="M 330 512 L 846 544" marker-end="url(#ah)"/>
  <text class="data" x="310" y="517" text-anchor="end">数据 3001~4000</text>
  <path class="msg-line" d="M 850 568 L 334 600" marker-end="url(#ah)"/>
  <text class="ack" x="870" y="573">下一个是4001</text>
  <text class="win" x="980" y="573">窗口0</text>

  <!-- 窗口为 0 的等待区间：上下双箭头 + 左侧说明 -->
  <text class="note" x="590" y="622" text-anchor="middle">窗口为 0，发送方停止发送</text>
  <path class="interval" d="M 320 650 L 320 600" marker-end="url(#ah-blue)"/>
  <path class="interval" d="M 320 650 L 320 700" marker-end="url(#ah-blue)"/>
  <text class="note" x="288" y="622" text-anchor="end">过了重发超时的时间以后若</text>
  <text class="note" x="288" y="644" text-anchor="end">还没有收到窗口更新的通知，</text>
  <text class="note" x="288" y="666" text-anchor="end">发送端会发送一个窗口探测包。</text>

  <path class="probe-line" d="M 330 700 L 846 732" marker-end="url(#ah-blue)"/>
  <text class="data" x="310" y="705" text-anchor="end">4001~4001</text>
  <text class="tag" x="588" y="704" text-anchor="middle" transform="rotate(3.55 588 704)">（窗口探测）</text>

  <path class="msg-line" d="M 850 756 L 334 788" marker-end="url(#ah)"/>
  <text class="ack" x="870" y="761">下一个是4001</text>
  <text class="win" x="980" y="761">窗口0</text>

  <path class="upd-line" d="M 850 812 L 334 844" marker-end="url(#ah-amber)"/>
  <text class="ack" x="870" y="817">下一个是4001</text>
  <text class="win" x="980" y="817">窗口2000</text>
  <g transform="rotate(-3.55 600 815)">
    <text class="tag" x="600" y="815" text-anchor="middle">（窗口更新通知）</text>
    <circle class="badge" cx="668" cy="810" r="8"/>
    <text class="badge-t" x="668" y="814" text-anchor="middle">1</text>
  </g>

  <path class="msg-line" d="M 330 868 L 846 900" marker-end="url(#ah)"/>
  <text class="data" x="310" y="873" text-anchor="end">4001~5000</text>
  <path class="msg-line" d="M 330 924 L 846 956" marker-end="url(#ah)"/>
  <text class="data" x="310" y="929" text-anchor="end">5001~6000</text>

  <path class="gauge" d="M 1090 200 L 1090 578" marker-end="url(#ah-amber)"/>
  <text class="axis" x="1090" y="192" text-anchor="middle">3000</text>
  <text class="axis" x="1090" y="600" text-anchor="middle">0</text>
  <path class="span" d="M 1122 690 L 1122 568" marker-end="url(#ah-amber)"/>
  <path class="span" d="M 1122 690 L 1122 812" marker-end="url(#ah-amber)"/>
  <text class="axis-v" x="1150" y="690" transform="rotate(-90 1150 690)" text-anchor="middle">接收端主机缓冲区满的状态下</text>

  <circle class="badge" cx="76" cy="1012" r="8"/>
  <text class="badge-t" x="76" y="1016" text-anchor="middle">1</text>
  <text class="note" x="94" y="1017">一旦窗口更新通知在传送途中丢失，会导致无法继续通信，因此发送端主机时不时就会发送窗口探测包。</text>
</svg>
